# 1. Global options

# Fix colors inside of a tmux session
set-option -sa terminal-overrides ",xterm*:Tc"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# 2. Key bindings

# Change prefix key
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload configuration
bind r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display "Config reloaded."

# Set vi-mode
set-window-option -g mode-keys vi

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Open panes in cwd
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Triggers a directory selection menu, then
# opens a new tmux session with the chosen directory as the working directory.
bind-key -r f run-shell "tmux neww $HOME/.local/bin/zsesh"
# Opens a new session with `$XDG_CONFIG_HOME/tmux` as the working directory.
bind-key -r T run-shell "$HOME/.local/bin/zsesh $XDG_CONFIG_HOME/tmux"
# Opens a new session with `$XDG_CONFIG_HOME/nvim` as the working directory.
bind-key -r V run-shell "$HOME/.local/bin/zsesh $XDG_CONFIG_HOME/nvim"

# Runs utils.
# bind-key -r i run-shell "tmux neww $HOME/.local/bin/cht.sh"
# bind-key -r D run-shell "tmux neww $HOME/.local/bin/todo.sh"

# Kill the current tmux session and switch to the active one.
bind C-d run-shell "$XDG_CONFIG_HOME/tmux/scripts/kill-session.zsh"

# 3. Theme

source "$XDG_CONFIG_HOME/tmux/themes/thewayilikeit.conf"

# 4. Plugins

# Changing plugins install dir.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$XDG_DATA_HOME/tmux/plugins/"

# set -g @catppuccin_flavour 'frappe' # latte or frappe, macchiato, mocha

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'tmux-plugins/tmux-logging'
set -g @logging-path "$XDG_STATE_HOME/tmux/logging/"

# Save log into file
# run-shell /opt/

run "$XDG_DATA_HOME/tmux/plugins/tpm/tpm"
